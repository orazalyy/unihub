name: Uptime check

# Requirement R12: checks the live site every 5 minutes. A run fails when /api/health does not answer
# {"app": "UniHub", ...} within 20 s, so uptime = successful runs / all runs in the Actions history.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: GET /api/health
        run: |
          body=$(curl -fsS --max-time 20 --retry 2 --retry-delay 5 https://unihubb.vercel.app/api/health)
          echo "$body"
          echo "$body" | grep -q '"app": *"UniHub"'
